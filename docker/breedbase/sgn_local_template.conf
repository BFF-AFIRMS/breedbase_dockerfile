# Project
project_name                Best Future Forests
identifier_prefix           BFF

# Version information
sgn_repository              https://github.com/bff-afirms/sgn
version                     sgn-453.1
version_updated             2026-05-25T11:56:00-06:00


# Server Information
production_server           1
using_frontend_proxy        1
main_production_site_url    http://{DOMAIN_NAME}:8080
allowed_origins             http://localhost:5173 # Svelte server for development purposes
www_user                    sgn
www_group                   sgn

# Database Information
dbhost                      breedbase_db
dbname                      breedbase
dbuser                      web_usr
dbpass                      {WEB_USR_PASSWORD}

# Authentication
disable_login               0
require_login               1

# Homepage
homepage_display_phenotype_uploads 0
personalized_homepage              1

# Genotyping
default_genotyping_protocol "analysis"

# Organisms
preferred_species           Pinus contorta

# Tissue Samples
sample_tissue_types needle,cambium,leaf,root,stem,seed,fruit,tuber

# Ontology and traits
onto_root_namespaces        TI_TRAIT (Tree Improvement Trait Ontology), TI_METHOD (Tree Improvement Method Ontology), TI_TISSUE (Tree Improvement Tissue Ontology), TI_UNIT (Tree Improvement Unit Ontology), TI_TREATMENT (Tree Improvement Treatment Ontology), SO (Sequence Ontology), UO (Units), COMP (Composed Traits), TIME (Time), CHEBI (Attribute)
trait_ontology_db_name      TI_TRAIT
trait_ontology_cv_name      tree_improvement_trait
trait_ontology_cvterm_name  Tree Improvement Trait Ontology
composable_variables        1 #display only variable terms in the post composing tool
composable_cvs              trait,object,method,experiment_treatment,tod,toy,unit
composable_cvs_allowed_combinations    Tree Improvement|trait+object+attribute+tod+toy+age+unit+method
composable_cvterm_delimiter |
composable_cvterm_format concise
allow_trait_edits           1
allow_treatment_edits       1

composable_tod_root_cvterm                        "time of day|TIME:0000001"
composable_toy_root_cvterm                        "time of year|TIME:0000005"
composable_evt_root_cvterm                        "event|TIME:0000477"
composable_validation_check_name                  0
allow_observation_variable_submission_interface   0

# cview
cview_db_backend            Cassava
<Controller::Cview>
    cview_default_map_id 1
</Controller::Cview>

# Slurm
backend                     Slurm
cluster_host                ""

# System Paths
archive_path                /home/production/volume/archive/
basepath                    /home/production/cxgn/sgn
blast_path                  ""
blast_db_path               /home/production/volume/blast/databases/current
cache_file_path             /home/production/volume/cache
cluster_shared_tempdir      /home/production/volume/tmp
error_log                   /var/log/sgn/error.log
access_log                  /var/log/sgn/access.log
ftpsite_root                /home/production/volume/public
homepage_files_dir          /home/production/volume/public/static_content
image_dir                   /images/image_files_test
image_path                  /home/production/volume/public/images/image_files_test
jbrowse_path                /jbrowse_cassavabase/?data=data/json
job_finish_log              /opt/cxgn/volume/logs/job_finish.log
python_executable           python3
r_qtl_temp_path             /home/production/volume/tmp/solqtl___USERNAME__
rootpath                    /home/production/cxgn
solgs_dir                   /home/production/volume/tmp/solgs/__USERNAME__
submit_dir                  /home/production/volume/public/submit-uploads
static_content_url          /static_content
static_datasets_path        /home/production/volume/public
static_content_path         /home/production/volume/public/static_content
tempfiles_base              /home/production/volume/tmp/breedbase-site
trial_download_logfile      /home/production/volume/logs/download_log

# Stock properties
# stock properties that should be displayed and allowed to be edited in the
# "additional information" section and can be used in the accession file upload

editable_stock_props family,province,breeding_region,location,latitude,longitude,elevation,RES-FOR Tree Code,NON RES-FOR Tree Code,variety,released_variety_name,donor,donor institute,donor PUI,country of orig>
editable_stock_props_definitions released_variety_name:offical variety name of the accession or stock,location_code:location code(s) for the accession,ploidy:a number(s) indicating the ploidy (e.g. 2 for dipl>

# Field trial
management_factor_types Fertilizer,Fungicide,Irrigation,Drought,Herbicide,Weeding,Pruning,Hormone treatment,Light treatment,Pollen,Insect,Disease,Crown,Permanent Sample Tree

# these are the default initial values for the phenotype download dialog
# the user can change the behavior for each individual download
pheno_download_default_repeat_measurements              last      # repeat measurements - one of: first, last, average, sum, all_values_single_line, all_values_multiple_line
pheno_download_default_include_timestamps               0         # include timestamps - boolean
pheno_download_default_include_intercrop_accessions     0         # include intercrop accessions columns - boolean
pheno_download_default_include_entry_numbers            0         # include entry numbers column - boolean
pheno_download_default_include_trait_synonyms           1         # include trait synonyms - boolean
exclude_phenotype_outliers                              0         # supress user-defined outliers - boolean (used in downloads and some analysis tools)


<oidc_client>
    <keycloak>
        client_id              breedbase                                                        # [REQUIRED] Client ID in keycloak
        client_secret          ThisIsASecretYouShouldChangeItxx                                 # [REQUIRED] Client ID in keycloak
        well_known_url         http://keycloak:9080/auth/realms/Breedbase/.well-known/openid-configuration  # [REQUIRED] Well Known Configuration
        code_challenge_method  S256                                                             # [OPTIONAL] PKCE code challenge method
        auto_provision         0                                                                # [OPTIONAL] If email does not exist in database, do not create new user
    </keycloak>
</oidc_client>
