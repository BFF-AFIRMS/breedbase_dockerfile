services:

  # Visualizer for selenium browser automation
  novnc:
    hostname: novnc
    container_name: novnc
    image: theasp/novnc:latest
    # Restrict security privileges
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    environment:
      DISPLAY_WIDTH: 1920
      DISPLAY_HEIGHT: 1080
      RUN_XTERM: no
    ports:
      - "8081:8080"

  # Browser automation
  selenium:
    hostname: selenium
    container_name: selenium
    image: selenium/standalone-firefox:3.141.59
    shm_size: '2gb'
    # Restrict security privileges
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    depends_on:
      - novnc
    healthcheck:
      test: "curl --silent --head http://localhost:4444 || exit 1"
    volumes:
      # required volumes
      - type: bind
        source: ../cxgn/sgn/t/data
        target: /home/production/cxgn/sgn/t/data
        bind:
          create_host_path: false

      - type: bind
        source: ../data/breedbase
        target: /downloads
        bind:
          create_host_path: false

    environment:
      DISPLAY: novnc:0.0
    ports:
       - 5900:5900
       - 4444:4444


