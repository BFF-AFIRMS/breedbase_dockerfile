services:

  # Browser automation
  selenium:
    hostname: selenium
    image: selenium/standalone-firefox:156.0
    shm_size: '2gb'
    # Restrict security privileges
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    healthcheck:
      test: "curl --silent --head http://localhost:4444 || exit 1"
    volumes:
      # required volumes
      - type: bind
        source: ../../cxgn/sgn/t/data
        target: /home/production/cxgn/sgn/t/data
        bind:
          create_host_path: false

      - type: bind
        source: $PWD/data/breedbase
        target: /downloads
        bind:
          create_host_path: false

    environment:
      SE_VNC_NO_PASSWORD: 1

    ports:
       - 5900:5900
       - 4444:4444
       - 7900:7900
