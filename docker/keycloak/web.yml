include:
  - db.yml

services:

  keycloak:
    hostname: keycloak
    image: bffafirms/keycloak:26.7.2
    build:
      context: .
    # Restrict security privileges
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    depends_on:
      keycloak_db:
        condition: service_healthy
    environment:
      KC_DB_USERNAME:              keycloak
      KC_DB_PASSWORD:              keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KC_DB_URL:                   jdbc:postgresql://keycloak_db:5432/keycloak
      KC_HOSTNAME:                 http://keycloak:9080/auth
      KC_HOSTNAME_ADMIN:           http://keycloak:9080/auth
      REALM_FILE:                  breedbase-realm.json
    expose:
      - 9080
    ports:
      - "9080:9080"
    entrypoint: /entrypoint.sh
    volumes:
      - type: bind
        source: ./web_entrypoint.sh
        target: /entrypoint.sh
        bind:
          create_host_path: false

      - type: bind
        source: $PWD/data/keycloak
        target: /data/keycloak
        bind:
          create_host_path: false

    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          cpus: 1
          memory: 1G
