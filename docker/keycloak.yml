services:

  keycloak:
    hostname: keycloak
    container_name: keycloak
    image: bffafirms/keycloak:26.5.1-0-breedbase-testing
    # Restrict security privileges
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    depends_on:
      keycloak_db:
        condition: started
    environment:
      KC_DB_USERNAME:              keycloak
      KC_DB_PASSWORD:              keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KC_DB_URL:                   jdbc:postgresql://keycloak_db:5432/keycloak
      KC_HOSTNAME: http://localhost:9080/auth
    expose:
      - 9080
    ports:
      - "9080:9080"
    entrypoint: /entrypoint.sh
    volumes:
      - type: bind
        source: ../docker/keycloak_entrypoint.sh
        target: /entrypoint.sh
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          cpus: 1
          memory: 1G
