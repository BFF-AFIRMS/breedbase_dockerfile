name: development

include:
  - docker/breedbase_db.yml
  - docker/keycloak.yml
  - docker/web_volumes.yml

services:

  breedbase:
    extends:
      file: docker/web.yml
      service: breedbase
    depends_on:
      breedbase_db:
        condition: service_healthy    
      keycloak:
        condition: service_healthy
    environment:
      MODE:            DEVELOPMENT
      SGN_TEST_SERVER: http://breedbase:3010
    volumes:
      - type: bind
        source: ./cxgn
        target: /home/production/cxgn
        bind:
          create_host_path: false

      - type: bind
        source: ./.git
        target: /home/production/.git
        bind:
          create_host_path: false

      # # mount scripts when developing the docker image itself
