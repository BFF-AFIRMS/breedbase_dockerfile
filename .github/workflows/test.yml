# Re-usable workflow to test deployments
name: Test
on:
  workflow_call:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * 0'

jobs:

  # ---------------------------------------------------------------------------
  # Build Docker Image

  build:
    uses: ./.github/workflows/build.yml

  # ---------------------------------------------------------------------------
  # Deployment Modes

  deployment:

    needs: build
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1

    strategy:
      fail-fast: false
      matrix:
        mode: [quickstart, development, production, testing]

    steps:

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: breedbase-docker

      # parse tag from load output, PR have unusual formats, also sometimes multiple tags
      - name: Load Docker Image
        run: |
          load=$(docker load --input breedbase.tar | tee /dev/stderr)
          echo -e $load
          TAG=$(echo -e $load | sed 's/Loaded image: //g' | head -n 1 | cut -d ":" -f 2 | cut -d " " -f 1)
          echo DOCKER_TAG="$TAG" >> $GITHUB_ENV

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Link compose file
        run: |
          ln -s compose.yml compose.quickstart.yml

      - name: Setup
        run: ./setup

      # ---------------------------------------------------------------------------
      # Deployments

      - name: Build supporting images
        run: docker compose -f compose.${{ matrix.mode }}.yml build --no-cache

      - name: Start containers
        run: docker compose -f compose.${{ matrix.mode }}.yml up -d

      - name: Healthcheck containers
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: ${{ matrix.mode }}-breedbase-1
          wait-time: 300
          require-status: running
          require-healthy: true

      - name: Breedbase DB container log
        if: always()
        run: docker compose -f compose.${{ matrix.mode }}.yml logs breedbase_db

      - name: Breedbase Web container log
        if: always()
        run: docker compose -f compose.${{ matrix.mode }}.yml logs breedbase

      - name: Keycloak Web container log
        if: ${{ (matrix.mode == 'testing') || (matrix.mode == 'development') }}
        run: docker compose -f compose.${{ matrix.mode }}.yml logs keycloak

      - name: Stop containers
        run: docker compose down

      - name: Clean volumes
        run: docker volume prune -af

      - name: Clean data
        run: rm -rf data

  # ---------------------------------------------------------------------------
  # Test Suite

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DOCKER_BUILDKIT: 1

    strategy:
      fail-fast: false
      matrix:
        subtest_key:
          - unit
          - unit_fixture
          - unit_mech
          - selenium2_list
          - selenium2_trial
          - selenium2_dataset
          - selenium2_authenticate
          - selenium2_breeders
          - selenium2_onto
          - selenium2_search
          - selenium2_stock
          - selenium2_tools

    steps:

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: breedbase-docker

      # parse tag from load output, PR have unusual formats, also sometimes multiple tags
      - name: Load Docker Image
        run: |
          load=$(docker load --input breedbase.tar | tee /dev/stderr)
          echo -e $load
          TAG=$(echo -e $load | sed 's/Loaded image: //g' | head -n 1 | cut -d ":" -f 2 | cut -d " " -f 1)
          echo DOCKER_TAG="$TAG" >> $GITHUB_ENV

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup
        run: ./setup

      - name: Build supporting images
        run: docker compose -f compose.testing.yml build --no-cache

      # -----------------------------------------------------------------------
      # Testing

      # use -s flag to show stderr
      - name: Run quick setup
        run: |
          ./run_test -s t/unit/CXGN/String
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run unit tests
        if: ${{ matrix.subtest_key == 'unit' }}
        run: |
          ./run_test t/unit
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run fixture tests
        if: ${{ matrix.subtest_key == 'unit_fixture' }}
        run: |
          ./run_test t/unit_fixture
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run mech tests
        if: ${{ matrix.subtest_key == 'unit_mech' }}
        run: |
          ./run_test t/unit_mech
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      # Run all selenium tests individually to avoid solgs for now
      - name: Run selenium tests lists
        if: ${{ matrix.subtest_key == 'selenium2_list' }}
        run: |
          ./run_test t/selenium2/01_list
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests trial
        if: ${{ matrix.subtest_key == 'selenium2_trial' }}
        run: |
          ./run_test t/selenium2/02_trial
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests dataset
        if: ${{ matrix.subtest_key == 'selenium2_dataset' }}
        run: |
          ./run_test t/selenium2/03_dataset
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests authenticate
        if: ${{ matrix.subtest_key == 'selenium2_authenticate' }}
        run: |
          ./run_test t/selenium2/authenticate
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests breeders
        if: ${{ matrix.subtest_key == 'selenium2_breeders' }}
        run: |
          ./run_test t/selenium2/breeders
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests onto
        if: ${{ matrix.subtest_key == 'selenium2_onto' }}
        run: |
          ./run_test t/selenium2/onto
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests search
        if: ${{ matrix.subtest_key == 'selenium2_search' }}
        run: |
          ./run_test t/selenium2/search
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests stock
        if: ${{ matrix.subtest_key == 'selenium2_stock' }}
        run: |
          ./run_test t/selenium2/stock
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

      - name: Run selenium tests tools
        if: ${{ matrix.subtest_key == 'selenium2_tools' }}
        run: |
          ./run_test t/selenium2/tools
          exit $(docker inspect testing-breedbase-1 --format='{{.State.ExitCode}}')

  # ---------------------------------------------------------------------------
  # Cleanup

  cleanup:

    needs: [deployment, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Delete Docker iamge
        uses: geekyeggo/delete-artifact@v6
        with:
            name: breedbase-docker