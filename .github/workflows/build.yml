# Re-usable workflow to build image and run tests
name: Build

on:
  workflow_call:
    
jobs:

  # ---------------------------------------------------------------------------
  # Deployment Modes

  deployment:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1
      PRUNE_CMD: docker container prune -f

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: quickstart
          - mode: development
          - mode: production
          - mode: testing
        
    steps:

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Link compose file
        run: |
          ln -s compose.yml compose.quickstart.yml
   
      - name: Build container image
        run: docker build -t bffafirms/breedbase:latest .

      - name: Setup
        run: ./setup

      - name: Start containers
        run: docker compose -f compose.${{ matrix.mode }}.yml up -d

      - name: Healthcheck containers
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: ${{ matrix.mode }}-breedbase-1
          wait-time: 300
          require-status: running
          require-healthy: true

      - name: Stop containers
        run: docker compose down

      - name: Clean volumes
        run: docker volume prune -af

      - name: Clean data
        run: rm -rf data

  # ---------------------------------------------------------------------------
  # Test Suite

  test:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true
    
      - name: Build container image
        run: docker build -t bffafirms/breedbase:latest .

      - name: Setup
        run: ./setup

      # -----------------------------------------------------------------------
      # Testing

      # Patch database, and dump to file, build node modules
      - name: Load/dump fixture database and build node modules
        run: ./run_test --dumpupdatedfixture t/unit/CXGN/String

      # Unit tests don't need a database or a server
      - name: Run unit tests
        run: ./run_test --nopatch --noserver t/unit 2>/dev/null

