# Re-usable workflow to test deployments
name: Deployment

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 0'

env:
  SITE_OVERLAY: treeimprovementbase

jobs:

  # ---------------------------------------------------------------------------
  # Deployment Modes

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1
      PRUNE_CMD: docker container prune -f

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: quickstart
          - mode: development
          - mode: production
          - mode: testing

    steps:

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Link compose file
        run: |
          ln -s compose.yml compose.quickstart.yml

      - name: Build container image
        run: docker build -t bffafirms/breedbase:latest .

      # ---------------------------------------------------------------------------
      # No Overlay

      - name: Setup
        run: ./setup

      - name: Start containers
        run: docker compose -f compose.${{ matrix.mode }}.yml up -d

      - name: Healthcheck containers
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: ${{ matrix.mode }}-breedbase-1
          wait-time: 300
          require-status: running
          require-healthy: true

      - name: Stop containers
        run: docker compose down

      - name: Clean volumes
        run: docker volume prune -af

      - name: Clean data
        run: rm -rf data

      # ---------------------------------------------------------------------------
      # Site Overlay


      - name: Setup overlay
        run: ./setup

      - name: Configure overlay
        run: echo "SITE_OVERLAY=$SITE_OVERLAY" >> .env

      - name: Start containers overlay
        run: docker compose -f compose.${{ matrix.mode }}.yml up -d

      - name: Healthcheck containers overlay
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: ${{ matrix.mode }}-breedbase-1
          wait-time: 300
          require-status: running
          require-healthy: true

      - name: Stop containers overlay
        run: docker compose down

      - name: Clean volumes overlay
        run: docker volume prune -af

      - name: Clean data overlay
        run: rm -rf data
