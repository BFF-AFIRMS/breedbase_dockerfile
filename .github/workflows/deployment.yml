# Re-usable workflow to test deployments
name: Deployment

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 0'

jobs:

  # ---------------------------------------------------------------------------
  # Build Docker Image

  build:
    uses: ./.github/workflows/build.yml

  # ---------------------------------------------------------------------------
  # Deployment Modes

  deployment:

    needs: build
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DOCKER_BUILDKIT: 1

    strategy:
      fail-fast: false
      matrix:
        mode: [quickstart, development, production, testing]

    steps:

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: breedbase-docker
          path: breedbase.tar

      # parse tag from load output, PR have unusual formats, also sometimes multiple tags
      - name: Load Docker Image
        run: |
          load=$(docker load --input breedbase.tar | tee /dev/stderr)
          echo -e $load
          TAG=$(echo -e $load | sed 's/Loaded image: //g' | head -n 1 | cut -d ":" -f 2 | cut -d " " -f 1)
          echo DOCKER_TAG="$TAG" >> $GITHUB_ENV

      - name: Checkout breedbase_dockerfile repo
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Link compose file
        run: |
          ln -s compose.yml compose.quickstart.yml

      - name: Setup
        run: ./setup

      # ---------------------------------------------------------------------------
      # Deployments

      - name: Build supporting images
        run: docker compose -f compose.${{ matrix.mode }}.yml build --no-cache

      - name: Start containers
        run: docker compose -f compose.${{ matrix.mode }}.yml up -d

      - name: Healthcheck containers
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: ${{ matrix.mode }}-breedbase-1
          wait-time: 300
          require-status: running
          require-healthy: true

      - name: Breedbase DB container log
        if: always()
        run: docker compose -f compose.${{ matrix.mode }}.yml logs breedbase_db

      - name: Breedbase Web container log
        if: always()
        run: docker compose -f compose.${{ matrix.mode }}.yml logs breedbase

      - name: Keycloak Web container log
        if: ${{ (matrix.mode == 'testing') || (matrix.mode == 'development') }}
        run: docker compose -f compose.${{ matrix.mode }}.yml logs keycloak

      - name: Stop containers
        run: docker compose down

      - name: Clean volumes
        run: docker volume prune -af

      - name: Clean data
        run: rm -rf data

      - name: Delete Docker iamge
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
            name: breedbase-docker